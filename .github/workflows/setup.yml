# Runs setup.sh / setup.ps1 on fresh machines (Ubuntu, other distributions, macOS, Windows), twice:
# the second run must find everything in place. Then checks the app starts and Whisper runs.
# Summaries are skipped: the Ollama model is several GB.
name: setup

on:
  push:
    paths: [setup.sh, setup.ps1, "requirements*", run.sh, run.bat, live_caption.py, "lib/**", .github/workflows/setup.yml]
  pull_request:
  workflow_dispatch:
  workflow_call:  # by lock.yml, to test new lock files before proposing them
    inputs:
      locks:
        description: An artifact of this run with requirements*.lock files to use instead of the committed ones
        type: string
        required: false

env:
  # A tiny Whisper model keeps the download small; draft and final text then share it.
  SETUP_ARGS: --model tiny --draft-model tiny --no-summary
  SMOKE: |  # run from stdin in the project folder, so `import lib` works
    import numpy as np
    import lib.main  # every module of the app, Tkinter included
    from faster_whisper import WhisperModel
    model = WhisperModel("tiny", device="cpu", compute_type="int8")
    segments, info = model.transcribe(np.zeros(2 * 16000, dtype=np.float32))
    print("Whisper OK:", len(list(segments)), "segments,", info.duration, "s")
    from lib import winaudio  # Windows' Core Audio through ctypes: runners have no sound device, so None, no crash
    print("Default output / input:", winaudio.default_device_name(False), "/", winaudio.default_device_name(True))

jobs:
  unix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Ubuntu, os: ubuntu-latest}
          - {name: macOS, os: macos-latest}
    steps:
      - uses: actions/checkout@v5
      - name: New lock files to test
        if: inputs.locks
        uses: actions/download-artifact@v4
        with: {name: "${{ inputs.locks }}"}
      - name: setup.sh
        run: ./setup.sh $SETUP_ARGS
      - name: setup.sh again (nothing left to do)
        run: ./setup.sh $SETUP_ARGS
      - name: App starts, Whisper runs
        run: |
          ./run.sh --help > /dev/null
          .venv/bin/python - <<< "$SMOKE"
          if [[ $RUNNER_OS == macOS ]]; then
            test -x ~/"Applications/Live Caption.app/Contents/MacOS/live-caption"
            plutil -lint ~/"Applications/Live Caption.app/Contents/Info.plist"
          else
            test -f ~/.local/share/applications/live-caption.desktop
          fi

  distros:
    # The other Linux families, each in its own container (as root, so setup.sh runs without sudo).
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      # The openSUSE image doesn't define PATH, so the runner wouldn't even find sh in it.
      env:
        PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    defaults:
      run:
        shell: bash  # in containers the default is sh, which is dash on Debian (no <<<)
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Debian, image: "debian:stable"}
          - {name: Fedora, image: "fedora:latest"}
          - {name: Arch Linux, image: "archlinux:latest", prepare: "pacman -Syu --noconfirm"}
          - {name: openSUSE Tumbleweed, image: "opensuse/tumbleweed:latest"}
    steps:
      - uses: actions/checkout@v5
      - name: New lock files to test
        if: inputs.locks
        uses: actions/download-artifact@v4
        with: {name: "${{ inputs.locks }}"}
      - name: Refresh the package lists
        if: matrix.prepare
        run: ${{ matrix.prepare }}
      - name: setup.sh
        run: bash ./setup.sh $SETUP_ARGS
      - name: setup.sh again (nothing left to do)
        run: bash ./setup.sh $SETUP_ARGS
      - name: App starts, Whisper runs
        run: |
          bash ./run.sh --help > /dev/null
          test -f ~/.local/share/applications/live-caption.desktop
          .venv/bin/python - <<< "$SMOKE"
          # setup.sh must have used the distribution's Python (smooth fonts), not uv's own
          .venv/bin/python -c "import sys; assert '/uv/python/' not in sys.base_prefix, sys.base_prefix"

  nvidia-update:
    # Updating an older setup on an NVIDIA computer. torch's CUDA build had brought cuDNN for CUDA 13, whose files
    # share nvidia/cudnn/lib with ours: removing it took ours along, and the app fell back to the CPU. The runner
    # has no GPU, so a stand-in nvidia-smi sends setup.sh down the NVIDIA path; the check is on the library files.
    name: Ubuntu, update of an older NVIDIA setup
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash  # with pipefail, for the | tee
    steps:
      - uses: actions/checkout@v5
      - name: New lock files to test
        if: inputs.locks
        uses: actions/download-artifact@v4
        with: {name: "${{ inputs.locks }}"}
      - name: A stand-in nvidia-smi
        run: |
          mkdir -p "$HOME/fake-nvidia"
          printf '#!/bin/sh\necho "NVIDIA GeForce GTX 1050, 4096 MiB"\n' > "$HOME/fake-nvidia/nvidia-smi"
          chmod +x "$HOME/fake-nvidia/nvidia-smi"
          echo "$HOME/fake-nvidia" >> "$GITHUB_PATH"
      - name: The environment older setups left (torch's CUDA build; CUDA 12 and 13 libraries side by side)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv venv --python /usr/bin/python3 .venv
          uv pip install --python .venv/bin/python faster-whisper torch nvidia-cublas-cu12 "nvidia-cudnn-cu12==9.*"
          uv pip list --python .venv/bin/python | grep -iE '^(torch|nvidia-cudnn)'
          uv pip list --python .venv/bin/python | grep -q nvidia-cudnn-cu13 \
            || echo "::warning::torch no longer brings nvidia-cudnn-cu13, so this job no longer recreates the old clash"
      - name: setup.sh
        run: ./setup.sh $SETUP_ARGS --no-whisper --no-shortcut | tee setup.log
      - name: The CUDA libraries are complete, torch is the CPU build
        run: |
          grep "Repairing the CUDA libraries" setup.log || echo "(no repair was needed)"
          .venv/bin/python - <<'EOF'
          import importlib.metadata as md, os
          import nvidia.cublas.lib, nvidia.cudnn.lib
          for lib, name in ((nvidia.cublas.lib, "libcublas.so.12"), (nvidia.cudnn.lib, "libcudnn.so.9")):
              assert any(os.path.exists(os.path.join(p, name)) for p in lib.__path__), f"{name} is missing"
          assert md.version("torch").endswith("+cpu"), f"torch {md.version('torch')} is not the CPU build"
          unused = sorted(n for d in md.distributions() if (n := d.metadata["Name"].lower()).startswith("nvidia-")
                          and not n.endswith("-cu12"))
          assert not unused, f"CUDA libraries nothing uses: {unused}"
          print("CUDA 12 libraries complete; torch", md.version("torch"))
          EOF
      - name: setup.sh again (nothing left to repair)
        run: |
          ./setup.sh $SETUP_ARGS --no-whisper --no-shortcut | tee setup-again.log
          if grep -q "Repairing the CUDA libraries" setup-again.log; then exit 1; fi

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell  # Windows PowerShell 5.1, the one every Windows PC has
    steps:
      - uses: actions/checkout@v5
      - name: New lock files to test
        if: inputs.locks
        uses: actions/download-artifact@v4
        with: {name: "${{ inputs.locks }}"}
      - name: setup.ps1
        run: |
          powershell -ExecutionPolicy Bypass -File setup.ps1 $env:SETUP_ARGS.Split(" ")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: setup.ps1 again (nothing left to do)
        run: |
          powershell -ExecutionPolicy Bypass -File setup.ps1 $env:SETUP_ARGS.Split(" ")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: App starts, Whisper runs
        run: |
          cmd /c "run.bat --help > NUL"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:SMOKE | .venv\Scripts\python.exe -  # via stdin: PowerShell 5.1 mangles quotes in arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $lnk = (New-Object -ComObject WScript.Shell).CreateShortcut("$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Live Caption.lnk")
          if (-not (Test-Path $lnk.TargetPath)) { throw "Start menu shortcut points to a missing file: $($lnk.TargetPath)" }
          "Shortcut: $($lnk.TargetPath) $($lnk.Arguments)"
